services:
  db:
    image: postgres:16
    container_name: app_db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: app_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ntnu.no
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "0.0.0.0:5050:80"
    volumes:
      - pgadmin_dev:/var/lib/pgadmin
    depends_on: [db]
    restart: unless-stopped

volumes:
  pgdata_dev:
  pgadmin_dev:
